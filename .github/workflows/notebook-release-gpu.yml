name: Notebook release execution (GPU)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-notebook:
    # The notebook's normative E2E path requires CUDA and private worker sources.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 75
    env:
      DIMER_NOTEBOOK_REF: ${{ github.sha }}
      GITHUB_TOKEN: ${{ secrets.DIMER_WORKER_READ_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Verify GPU and private-source prerequisites
        run: |
          if [[ -z "${GITHUB_TOKEN:-}" ]]; then
            echo "DIMER_WORKER_READ_TOKEN is required to read the private validator and finetuner repositories." >&2
            exit 1
          fi
          nvidia-smi
          python - <<'PY'
          import torch, torchvision
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is required for the Swin Notebook Spec E2E release path")
          print("torch", torch.__version__, "torchvision", torchvision.__version__, "cuda", torch.version.cuda, "gpu", torch.cuda.get_device_name(0))
          PY

      - name: Prepare clean notebook workspace
        run: |
          sudo mkdir -p /content
          sudo chown -R "$USER":"$USER" /content
          rm -rf /content/dimer-swin-classification
          python -m pip install --upgrade pip==26.2.1
          python -m pip install nbconvert==7.17.1 ipykernel==7.3.0

      - name: Execute E2E notebook top-to-bottom
        id: e2e
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute tutorials/swin_classification_colab.ipynb \
            --output executed-swin-classification-e2e.ipynb \
            --output-dir /content \
            --ExecutePreprocessor.timeout=4200 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Assert release outputs
        id: assert-outputs
        run: |
          test -f /content/executed-swin-classification-e2e.ipynb
          test -f /content/dimer-swin-classification/training-output/result.json
          test -f /content/dimer-swin-classification/training-output/evaluation-report.json
          test -f /content/dimer-swin-classification/exports/prediction.json
          test -f /content/dimer-swin-classification/exports/provenance.json
          test -f /content/dimer-swin-classification/exports/metrics.json
          test -f /content/dimer-swin-classification/exports/validation-predictions.csv
          python - <<'PY'
          import json
          m = json.load(open("/content/dimer-swin-classification/exports/metrics.json"))
          r = m["freshBoundaryReload"]
          assert r["accuracyMatches"] and r["crossEntropyMatches"], r
          print("fresh-boundary reload reproduced the reported metrics", r)
          PY

      - name: Upload notebook release evidence
        id: upload-evidence
        if: ${{ always() && steps.e2e.outcome == 'success' && steps.assert-outputs.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swin-classification-notebook-release-evidence
          path: |
            /content/executed-swin-classification-e2e.ipynb
            /content/dimer-swin-classification/training-output/result.json
            /content/dimer-swin-classification/training-output/evaluation-report.json
            /content/dimer-swin-classification/exports/prediction.json
            /content/dimer-swin-classification/exports/provenance.json
            /content/dimer-swin-classification/exports/metrics.json
            /content/dimer-swin-classification/exports/validation-predictions.csv
          if-no-files-found: error
          retention-days: 30

      - name: Record release evidence summary
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          OUTPUT_OUTCOME: ${{ steps.assert-outputs.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
        run: |
          if [[ "$E2E_OUTCOME" == "success" && "$OUTPUT_OUTCOME" == "success" && "$UPLOAD_OUTCOME" == "success" ]]; then
            RELEASE_STATUS="PASS"
          else
            RELEASE_STATUS="INCOMPLETE/FAIL"
          fi
          {
            echo "## Swin Classification Notebook Spec v1 GPU release execution"
            echo
            echo "- Notebook candidate SHA: \`${DIMER_NOTEBOOK_REF}\`"
            echo "- Pinned pipeline revision exercised: \`3e4087ab03d11a60f7ca4d54c4773e31fcfb188a\`"
            echo "- Runner: \`${RUNNER_OS}\` / \`${RUNNER_ARCH}\`"
            echo "- Python: \`$(python --version 2>&1)\`"
            echo "- GPU: \`$(nvidia-smi --query-gpu=name --format=csv,noheader | head -1)\`"
            echo "- E2E execution: \`${E2E_OUTCOME}\`"
            echo "- Required outputs: \`${OUTPUT_OUTCOME}\`"
            echo "- Evidence upload: \`${UPLOAD_OUTCOME}\`"
            echo "- Release evidence status: **${RELEASE_STATUS}**"
            echo "- No secret values are recorded in this summary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed unless GPU execution evidence is complete
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          OUTPUT_OUTCOME: ${{ steps.assert-outputs.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome }}
        run: |
          [[ "$E2E_OUTCOME" == "success" ]]
          [[ "$OUTPUT_OUTCOME" == "success" ]]
          [[ "$UPLOAD_OUTCOME" == "success" ]]
