name: Relay builder private-source fix

on:
  push:
    branches: [feat/dimer-tutorial-notebook-v1]
    paths:
      - ".github/workflows/relay-builder-private-source-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/dimer-tutorial-notebook-v1

      - name: Patch notebook and documentation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebook_path = Path("tutorials/swin_classification_colab.ipynb")
          nb = json.loads(notebook_path.read_text(encoding="utf-8"))

          def text(cell):
              source = cell.get("source", "")
              return "".join(source) if isinstance(source, list) else source

          def set_text(cell, value):
              cell["source"] = value

          prereq = next(cell for cell in nb["cells"] if cell.get("id") == "d2173f1b")
          prereq_text = text(prereq)
          auth_note = (
              "\n\nThe pinned validator and finetuner source repositories are private. "
              "Provide a Colab Secret named `GITHUB_TOKEN` (or a `GITHUB_TOKEN` environment variable outside Colab) "
              "with read access to those repositories. Authentication is passed to Git through an ephemeral HTTP header; "
              "the token is not printed, embedded in a URL, or stored in repository config."
          )
          if "source repositories are private" not in prereq_text:
              set_text(prereq, prereq_text + auth_note)

          cell = next(cell for cell in nb["cells"] if cell.get("id") == "a7875dc6")
          source = text(cell)
          source = source.replace(
              "import hashlib, json, platform, random, shutil, subprocess, sys\n",
              "import base64, hashlib, json, os, platform, random, shutil, subprocess, sys\n",
          )
          source = source.replace(
              'def run(cmd,cwd=None):\n    cmd=[str(x) for x in cmd]; print("+"," ".join(cmd)); subprocess.run(cmd,cwd=cwd,check=True)\n',
              'def run(cmd,cwd=None,env=None):\n    cmd=[str(x) for x in cmd]; print("+"," ".join(cmd)); subprocess.run(cmd,cwd=cwd,check=True,env=env)\n\n'
              'def private_github_token():\n'
              '    token=os.environ.get("GITHUB_TOKEN","").strip()\n'
              '    if token:\n'
              '        return token\n'
              '    try:\n'
              '        from google.colab import userdata\n'
              '        token=(userdata.get("GITHUB_TOKEN") or "").strip()\n'
              '    except Exception:\n'
              '        token=""\n'
              '    if not token:\n'
              '        raise RuntimeError("Private validator/finetuner source requires a GITHUB_TOKEN Colab Secret or environment variable with read access.")\n'
              '    return token\n\n'
              'def private_git_env(token):\n'
              '    credential=base64.b64encode(f"x-access-token:{token}".encode()).decode()\n'
              '    env=os.environ.copy()\n'
              '    env.update({"GIT_TERMINAL_PROMPT":"0","GIT_CONFIG_COUNT":"1","GIT_CONFIG_KEY_0":"http.https://github.com/.extraHeader","GIT_CONFIG_VALUE_0":f"Authorization: Basic {credential}"})\n'
              '    return env\n',
          )
          marker = 'for url,ref,dst in [\n ("https://github.com/kurtvalcorza/swin-classification-dataset-validator.git",vr["sourceRevision"],V),\n ("https://github.com/kurtvalcorza/swin-classification-finetuner.git",fr["sourceRevision"],F)]:\n    if not dst.exists(): run(["git","clone","--filter=blob:none",url,dst])\n    run(["git","checkout","--detach",ref],dst)\n'
          replacement = 'PRIVATE_TOKEN=private_github_token()\nPRIVATE_GIT_ENV=private_git_env(PRIVATE_TOKEN)\nfor url,ref,dst in [\n ("https://github.com/kurtvalcorza/swin-classification-dataset-validator.git",vr["sourceRevision"],V),\n ("https://github.com/kurtvalcorza/swin-classification-finetuner.git",fr["sourceRevision"],F)]:\n    if not dst.exists(): run(["git","clone","--filter=blob:none",url,dst],env=PRIVATE_GIT_ENV)\n    run(["git","checkout","--detach",ref],dst,env=PRIVATE_GIT_ENV)\ndel PRIVATE_TOKEN, PRIVATE_GIT_ENV\n'
          if marker not in source:
              raise SystemExit("Expected private clone block not found; refusing broad rewrite")
          source = source.replace(marker, replacement)
          set_text(cell, source)
          notebook_path.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + "\n", encoding="utf-8")

          readme_path = Path("tutorials/README.md")
          readme = readme_path.read_text(encoding="utf-8")
          anchor = "- The notebook exercises the pipeline release's pinned validator and finetuner worker CLIs rather than reimplementing the training path.\n"
          addition = (
              "- The validator and finetuner source repositories are private. The notebook requires a `GITHUB_TOKEN` Colab Secret/environment variable with read access and passes it through an ephemeral Git HTTP header; credentials are not printed, placed in clone URLs, or persisted in Git config.\n"
          )
          if addition not in readme:
              if anchor not in readme:
                  raise SystemExit("README anchor not found")
              readme = readme.replace(anchor, anchor + addition)
              readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Commit Builder fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/relay-builder-private-source-fix.yml
          git add tutorials/swin_classification_colab.ipynb tutorials/README.md
          git diff --cached --check
          git commit -m "fix(tutorials): securely authenticate private worker sources"
          git push origin HEAD:feat/dimer-tutorial-notebook-v1
